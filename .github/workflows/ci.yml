name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - phase2-foundation

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d job_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/job_agent_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations and verify Phase 2 migration is repeatable
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg2

          conn = psycopg2.connect(os.environ["POSTGRES_URL"])
          try:
              with conn.cursor() as cur:
                  cur.execute(Path("migrations/001_jobs.sql").read_text())
              conn.commit()

              phase2 = Path("migrations/002_phase2_foundation.sql").read_text()
              for _ in range(2):
                  with conn.cursor() as cur:
                      cur.execute(phase2)
                  conn.commit()
          finally:
              conn.close()
          PY

      - name: Lint
        run: ruff check src tests evals

      - name: Tests and deterministic evals
        run: pytest -q
