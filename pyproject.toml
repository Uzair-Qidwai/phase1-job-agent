[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phase1-job-agent"
version = "1.0.0"
description = "Job Search & CV Tailoring Agent — Phase 1"
requires-python = ">=3.11"

dependencies = [
    # Core AI
    "anthropic>=0.25.0",

    # Web scraping
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",

    # Database
    "psycopg2-binary>=2.9.9",

    # Scheduling
    "APScheduler>=3.10.4",

    # Google / Gmail
    "google-api-python-client>=2.130.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",

    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
